# Optional PostgreSQL backend (production path).
#
# 1. Create the credentials secret first (choose your own password):
#      oc create secret generic modelect-db \
#        --from-literal=username=modelect \
#        --from-literal=password=<STRONG_PASSWORD> \
#        --from-literal=database=modelect \
#        --from-literal=database-url="postgresql://modelect:<STRONG_PASSWORD>@modelect-postgres:5432/modelect"
# 2. oc apply -f openshift/postgres.yaml
# 3. Point the API at it:
#      oc set env deployment/orchestrator-api \
#        DATABASE_URL="$(oc get secret modelect-db -o jsonpath='{.data.database-url}' | base64 -d)"
#
# The one-shot script does all of this automatically: WITH_POSTGRES=1 ./modelect-deploy.sh ...
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: modelect-postgres-data
  labels:
    app: modelect-postgres
    app.kubernetes.io/part-of: modelect
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelect-postgres
  labels:
    app: modelect-postgres
    app.kubernetes.io/part-of: modelect
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: modelect-postgres
  template:
    metadata:
      labels:
        app: modelect-postgres
    spec:
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: modelect-postgres-data
      containers:
        - name: postgres
          # sclorg image runs under OpenShift's restricted SCC (arbitrary UID)
          image: quay.io/sclorg/postgresql-15-c9s:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom: {secretKeyRef: {name: modelect-db, key: username}}
            - name: POSTGRESQL_PASSWORD
              valueFrom: {secretKeyRef: {name: modelect-db, key: password}}
            - name: POSTGRESQL_DATABASE
              valueFrom: {secretKeyRef: {name: modelect-db, key: database}}
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/pgsql/data
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            exec:
              command: [/usr/libexec/check-container]
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: modelect-postgres
  labels:
    app: modelect-postgres
    app.kubernetes.io/part-of: modelect
spec:
  selector:
    app: modelect-postgres
  ports:
    - port: 5432
      targetPort: 5432

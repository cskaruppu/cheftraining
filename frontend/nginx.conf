server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and gateway calls to the backend service (OpenShift/compose DNS)
    location /api/ {
        proxy_pass http://orchestrator-api:8000;
        proxy_set_header Host $host;
    }
    location /v1/ {
        proxy_pass http://orchestrator-api:8000;
        proxy_set_header Host $host;
        proxy_buffering off;          # keep SSE streaming working
        proxy_read_timeout 300s;
    }

    location /healthz {
        return 200 "ok";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-api
  labels:
    app: orchestrator-api
    {{- include "modelect.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: orchestrator-api
  template:
    metadata:
      labels:
        app: orchestrator-api
        {{- include "modelect.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.persistence.enabled (not .Values.database.url) }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: modelect-data
      {{- end }}
      containers:
        - name: api
          image: {{ include "modelect.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          {{- if .Values.database.url }}
          env:
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
          {{- else if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /opt/app/data
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-api
  labels:
    app: orchestrator-api
    {{- include "modelect.labels" . | nindent 4 }}
spec:
  selector:
    app: orchestrator-api
  ports:
    - port: 8000
      targetPort: 8000

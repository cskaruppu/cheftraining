{{- if .Values.components.gateway }}
{{- $dburl := required "database.url is required when components.gateway is enabled — the RWO SQLite PVC cannot be shared between gateway and control pods" .Values.database.url }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-gateway
  labels:
    app: orchestrator-gateway
    {{- include "modelect.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: orchestrator-gateway
  template:
    metadata:
      labels:
        app: orchestrator-gateway
        {{- include "modelect.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Spread replicas across nodes when the cluster can: preferred, so
      # a single-node lab still schedules both.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: orchestrator-gateway
      containers:
        - name: gateway
          image: {{ include "modelect.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: MODELECT_ROLE
              value: gateway
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- if .Values.demoSeed }}
            - name: DEMO_SEED
              value: {{ .Values.demoSeed | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-gateway
  labels:
    app: orchestrator-gateway
    {{- include "modelect.labels" . | nindent 4 }}
spec:
  selector:
    app: orchestrator-gateway
  ports:
    - port: 8000
      targetPort: 8000
{{- if eq .Values.ingress.type "route" }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: orchestrator-gateway
  labels:
    app: orchestrator-gateway
    {{- include "modelect.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: orchestrator-gateway
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- end }}
